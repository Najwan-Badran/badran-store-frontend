<section class="automotive-page legal-page">
  <a class="ghost-button back-link" routerLink="/home">
    <span class="material-icons" aria-hidden="true">arrow_back</span>
    Back to home
  </a>

  <article class="dashboard-panel legal-panel">
    <span class="eyebrow">{{ page().eyebrow }}</span>
    <h1 class="page-title">{{ page().title }}</h1>
    <p class="page-copy">{{ page().body }}</p>
    <a class="brand-button" routerLink="/products">
      <span class="material-icons" aria-hidden="true">inventory_2</span>
      Browse products
    </a>
  </article>
</section>
